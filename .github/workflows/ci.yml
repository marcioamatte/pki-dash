name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can only read the repository.
permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA (supply-chain hardening).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The frontend is built first because the Go binary embeds web/dist.
      - name: Frontend install
        run: npm ci
        working-directory: web
      - name: Frontend type-check
        run: npm run check
        working-directory: web
      - name: Frontend tests
        run: npm test
        working-directory: web
      - name: Frontend build
        run: npm run build
        working-directory: web
      - name: Frontend dependency audit
        run: npm audit --audit-level=high
        working-directory: web
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Test
        run: go test -race ./...
      - name: Third-party notices are up to date
        run: |
          ./scripts/gen-notices.sh > "$RUNNER_TEMP/notices.md"
          diff -u THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/notices.md" \
            || { echo "Run scripts/gen-notices.sh and commit the result"; exit 1; }
      # Pinned version; module checksums are verified through the Go checksum DB.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds the UI and the binary inside the image, so this also proves the
      # Dockerfile works from a clean checkout.
      - name: Build image
        run: docker build --build-arg VERSION="ci-${GITHUB_SHA::7}" -t pki-dash:ci .
      - name: Smoke test the image
        run: ./scripts/container-smoke.sh pki-dash:ci
