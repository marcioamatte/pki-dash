# Weekly, reviewable updates for everything we pin: Go modules, npm packages,
# GitHub Actions (pinned by SHA) and the container base images (pinned by digest).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    ignore:
      # svelte-check supports TypeScript 5 and 6 only (peer dependency), so
      # TypeScript 7 cannot be installed yet. Drop this once svelte-check allows it.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
